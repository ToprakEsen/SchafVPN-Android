<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SchafVPN</title>
<script>
  /* Android köprüsü: Windows'taki WebView2 API'sini (chrome.webview) taklit eder */
  (function () {
    var listeners = [];
    window.chrome = window.chrome || {};
    window.chrome.webview = {
      postMessage: function (m) { SchafAndroid.post(JSON.stringify(m)); },
      addEventListener: function (type, cb) { if (type === 'message') listeners.push(cb); }
    };
    window.__schafReceive = function (data) { listeners.forEach(function (cb) { cb({ data: data }); }); };
  })();
</script>
<style>
  :root {
    --bg: #090b10;
    --text: #f3f4f7;
    --muted: #8a90a0;
    --faint: #565b6a;
    --line: rgba(255, 255, 255, 0.07);
    --surface: rgba(255, 255, 255, 0.035);
    --surface-2: rgba(255, 255, 255, 0.06);
    --idle: #7c95ff;
    --busy: #f5b544;
    --on: #3ddc97;
    --err: #ff6b6b;
    --accent: var(--idle);
    --accent-rgb: 124, 149, 255;
    --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --orb: clamp(170px, 30vh, 252px);
    --gutter: 22px;
  }
  body[data-state="connecting"] { --accent: var(--busy); --accent-rgb: 245, 181, 68; }
  body[data-state="connected"]  { --accent: var(--on);   --accent-rgb: 61, 220, 151; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--body);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 var(--gutter) var(--gutter);
  }

  /* ================= arka plan ================= */
  .aurora { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1000ms ease; }
  .aurora.idle {
    background:
      radial-gradient(60% 40% at 50% 34%, rgba(124,149,255,.20), transparent 70%),
      radial-gradient(70% 50% at 100% 0%, rgba(124,149,255,.07), transparent 70%);
  }
  .aurora.busy {
    background:
      radial-gradient(60% 40% at 50% 34%, rgba(245,181,68,.18), transparent 70%),
      radial-gradient(70% 50% at 100% 0%, rgba(245,181,68,.06), transparent 70%);
  }
  .aurora.on {
    background:
      radial-gradient(60% 40% at 50% 34%, rgba(61,220,151,.22), transparent 70%),
      radial-gradient(70% 50% at 0% 0%, rgba(61,220,151,.07), transparent 70%);
  }
  body[data-state="idle"] .aurora.idle,
  body[data-state="connecting"] .aurora.busy,
  body[data-state="connected"] .aurora.on { opacity: 1; }

  .dots {
    position: fixed; left: 0; right: 0; top: 5vh; height: 60vh; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.13) 1px, transparent 1.6px);
    background-size: 16px 16px;
    background-position: center;
    -webkit-mask-image: radial-gradient(closest-side at 50% 50%, #000 15%, transparent 100%);
            mask-image: radial-gradient(closest-side at 50% 50%, #000 15%, transparent 100%);
    opacity: .55;
  }

  /* ================= başlık çubuğu ================= */
  .bar {
    position: relative; z-index: 5;
    height: 48px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 -12px 0 -6px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; padding-left: 4px;
    font: 600 14px/1 var(--display); letter-spacing: -0.01em; color: #e6e8ee;
    pointer-events: none;
  }
  .mark {
    width: 26px; height: 26px; border-radius: 7px; display: block;
    box-shadow: 0 4px 14px -4px rgba(90,115,255,.75);
  }
  .mark svg { display: block; width: 100%; height: 100%; }
  .win { display: flex; gap: 2px; }
  .win button {
    width: 34px; height: 30px; border: 0; border-radius: 9px;
    background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .win button:hover { background: var(--surface-2); color: var(--text); }
  .win button.close:hover { background: rgba(255,90,90,.18); color: #ff9b9b; }
  .win button:active { transform: scale(.94); }
  .win svg { width: 12px; height: 12px; }

  /* ================= merkez ================= */
  .stage {
    position: relative; flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 6px;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px 6px 10px; border-radius: 99px;
    background: rgba(255,255,255,.045); border: 1px solid var(--line);
    font: 600 11.5px/1 var(--body); letter-spacing: .02em; color: #c9ccd6;
    backdrop-filter: blur(12px);
    margin-bottom: clamp(16px, 4vh, 40px);
  }
  .chip .cdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff8f6b; box-shadow: 0 0 8px rgba(255,143,107,.8);
    transition: background 400ms ease, box-shadow 400ms ease;
  }
  body[data-state="connecting"] .chip .cdot { background: var(--busy); box-shadow: 0 0 8px var(--busy); }
  body[data-state="connected"] .chip .cdot  { background: var(--on);   box-shadow: 0 0 8px var(--on); }

  .orb { position: relative; width: var(--orb); height: var(--orb); flex: none; }

  .halo { position: absolute; inset: -21.3%; pointer-events: none; }
  .halo circle { fill: none; stroke: rgba(255,255,255,.045); stroke-width: 1; transition: stroke 600ms ease; }
  body[data-state="connected"] .halo circle { stroke: rgba(var(--accent-rgb), .12); }

  .ripple {
    position: absolute; inset: 9.25%; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(var(--accent-rgb), .7); opacity: 0;
  }
  .ripple.go { animation: ripple 1100ms var(--ease-out) forwards; }
  @keyframes ripple { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(1.75); } }

  .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring .track { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 2; }
  .ring .arc {
    fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 640.9; stroke-dashoffset: 640.9;
    transition: stroke-dashoffset 750ms var(--ease-out), stroke 500ms ease;
    filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .8));
  }
  .spin { transform-origin: 108px 108px; transform: rotate(-90deg); }
  body[data-state="connecting"] .arc { stroke-dashoffset: 480; }
  body[data-state="connecting"] .spin { animation: spin 1.1s linear infinite; }
  body[data-state="connected"] .arc { stroke-dashoffset: 0; }
  @keyframes spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }

  .power {
    position: absolute; inset: 9.25%; border-radius: 50%; overflow: hidden;
    border: 1px solid rgba(255,255,255,.09);
    background:
      radial-gradient(90% 70% at 50% 14%, rgba(255,255,255,.11), rgba(255,255,255,0) 62%),
      linear-gradient(180deg, #171b25, #0e1117);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -10px 30px rgba(0,0,0,.35),
      0 28px 56px -18px rgba(0,0,0,.85);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer; outline: none; padding: 0;
    transition: color 450ms ease, box-shadow 600ms ease;
    will-change: transform;
  }
  .power::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(75% 55% at 50% 105%, rgba(var(--accent-rgb), .38), transparent 70%);
    opacity: 0; transition: opacity 600ms ease;
  }
  .power:hover { color: var(--text); }
  .power:hover::before { opacity: .45; }
  body[data-state="connecting"] .power { color: var(--busy); }
  body[data-state="connecting"] .power::before { opacity: .6; }
  body[data-state="connected"] .power {
    color: var(--on);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -10px 30px rgba(0,0,0,.25),
      0 28px 56px -18px rgba(0,0,0,.85),
      0 0 80px -12px rgba(61,220,151,.55);
  }
  body[data-state="connected"] .power::before { opacity: 1; }
  .power:focus-visible { box-shadow: 0 0 0 3px rgba(124,149,255,.6); }
  .power:disabled { cursor: not-allowed; color: var(--faint); }
  .power svg { position: relative; width: 28%; height: 28%; filter: drop-shadow(0 0 10px rgba(var(--accent-rgb), .0)); transition: filter 600ms ease; }
  body[data-state="connected"] .power svg { filter: drop-shadow(0 0 12px rgba(61,220,151,.6)); }

  .title {
    margin: clamp(18px, 4.2vh, 40px) 0 4px;
    font: 650 34px/1.1 var(--display); letter-spacing: -0.03em;
    text-align: center;
  }
  .sub {
    min-height: 20px; color: var(--muted); font-size: 13.5px;
    font-variant-numeric: tabular-nums; letter-spacing: .01em; text-align: center;
  }
  .swap { animation: swap 300ms var(--ease-out); }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ================= hız kutucukları ================= */
  .stats {
    position: relative; flex: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 12px;
  }
  .stat {
    position: relative; overflow: hidden;
    padding: 14px 16px 0; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .k .tot { margin-left: auto; }
  .k i {
    width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center;
    background: rgba(var(--accent-rgb), .12); color: var(--accent);
    transition: background 500ms ease, color 500ms ease;
  }
  body[data-state="idle"] .k i { background: var(--surface-2); color: var(--muted); }
  .k svg { width: 11px; height: 11px; }
  .v {
    position: relative; margin-top: 9px;
    font: 600 25px/1 var(--display); letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    transition: color 400ms ease;
  }
  .v small { font: 500 11.5px var(--body); color: var(--muted); letter-spacing: .01em; margin-left: 4px; }
  body[data-state="idle"] .v { color: var(--faint); }
  .tot { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spark { display: block; width: calc(100% + 32px); height: clamp(28px, 5vh, 44px); margin: 10px -16px 0; transition: opacity 400ms ease; }
  .spark .fill { fill: url(#sparkGrad); }
  .spark .line { fill: none; stroke: rgba(var(--accent-rgb), .75); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  body[data-state="idle"] .spark { opacity: .25; }

  /* ================= bilgi listesi ================= */
  .list {
    flex: none; border-radius: 20px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line);
  }
  .row { position: relative; display: flex; align-items: center; gap: 13px; padding: clamp(10px, 1.6vh, 14px) 16px; }
  .row + .row::before {
    content: ""; position: absolute; top: 0; left: 61px; right: 0; height: 1px; background: var(--line);
  }
  .ic {
    flex: none; width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--surface-2); color: #b9bdc9;
  }
  .ic svg { width: 15px; height: 15px; }
  .txt { min-width: 0; flex: 1; }
  .lbl { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
  .val {
    font-size: 14px; font-weight: 600; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .val.dim { color: var(--faint); font-weight: 500; }
  .tag {
    flex: none; font: 700 10px/1 var(--body); letter-spacing: .07em;
    padding: 5px 8px; border-radius: 7px;
    color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
  }
  .tag.cc { color: #c9ccd6; }
  .row.bad .val { color: var(--err); }

  /* ================= hata bildirimi ================= */
  .toast {
    position: fixed; left: 14px; right: 14px; top: 54px; z-index: 10;
    padding: 14px 14px 12px; border-radius: 16px;
    background: rgba(40, 16, 20, 0.84);
    border: 1px solid rgba(255,107,107,.28);
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.7);
    transform: translateY(calc(-100% - 70px));
    transition: transform 480ms var(--ease-out);
  }
  .toast.show { transform: none; }
  .toast h3 { margin: 0 0 4px; font: 600 14px/1.3 var(--display); color: #ffb3b3; }
  .toast p {
    margin: 0; font-size: 12px; color: #d9c4c6; line-height: 1.45;
    max-height: 70px; overflow: hidden; word-break: break-word; white-space: pre-wrap;
  }
  .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
  .actions button {
    font: 600 12px var(--body); color: var(--text); cursor: pointer;
    padding: 7px 12px; border-radius: 10px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  }
  .actions button:hover { background: rgba(255,255,255,.13); }
  .actions button:active { transform: scale(.97); }

  /* açılışta içerik yerine otursun */
  .enter { animation: enter 520ms var(--ease-out) both; }
  .enter.d1 { animation-delay: 60ms; } .enter.d2 { animation-delay: 120ms; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

  /* kısa ekranlar: boşlukları sıkıştır */
  @media (max-height: 780px) {
    :root { --orb: clamp(140px, 25vh, 200px); --gutter: 18px; }
    .bar { height: 42px; }
    .chip { margin-bottom: 14px; padding: 5px 11px 5px 9px; }
    .title { font-size: 28px; margin-top: 16px; }
    .stats { gap: 10px; margin-bottom: 10px; }
    .stat { padding-top: 11px; }
    .v { font-size: 22px; margin-top: 6px; }
    .spark { height: 24px; margin-top: 6px; }
    .row { padding: 8px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body[data-state="connecting"] .spin { animation: none; }
    .ring .arc, .toast { transition-duration: 1ms; }
    .ripple.go { animation: none; }
    .enter { animation: fade 200ms ease both; }
    .swap { animation: fade 200ms ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }

  /* ---- Android ---- */
  html, body { -webkit-tap-highlight-color: transparent; }
  .win, #logBtn { display: none !important; }
  .bar { margin: 0; }
  .power { cursor: default; }
  .power:hover { color: var(--muted); }
  .power:hover::before { opacity: 0; }
  body[data-state="connected"] .power:hover { color: var(--on); }
  body[data-state="connected"] .power:hover::before { opacity: 1; }
  body[data-state="connecting"] .power:hover { color: var(--busy); }
</style>
</head>
<body data-state="idle">
  <div class="aurora idle"></div><div class="aurora busy"></div><div class="aurora on"></div>
  <div class="dots"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: rgb(var(--accent-rgb)); stop-opacity: .28"/>
        <stop offset="1" style="stop-color: rgb(var(--accent-rgb)); stop-opacity: 0"/>
      </linearGradient>
    </defs>
  </svg>

  <header class="bar" id="bar">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fa6ff"/><stop offset="1" stop-color="#4459d4"/></linearGradient>
          <linearGradient id="lgWool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e3e8ff"/></linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#lgBg)"/>
        <g fill="url(#lgWool)"><circle cx="32" cy="17.5" r="8.5"/><circle cx="21.5" cy="21.5" r="8"/><circle cx="42.5" cy="21.5" r="8"/><circle cx="16.5" cy="31" r="7"/><circle cx="47.5" cy="31" r="7"/><circle cx="20" cy="40.5" r="6.5"/><circle cx="44" cy="40.5" r="6.5"/></g>
        <ellipse cx="14.5" cy="34" rx="6.2" ry="3.1" transform="rotate(-24 14.5 34)" fill="#262b52"/>
        <ellipse cx="49.5" cy="34" rx="6.2" ry="3.1" transform="rotate(24 49.5 34)" fill="#262b52"/>
        <path d="M32 24.5c6.4 0 10.2 5.1 10.2 12.3C42.2 45 37.9 51.5 32 51.5S21.8 45 21.8 36.8c0-7.2 3.8-12.3 10.2-12.3z" fill="#262b52"/>
        <g fill="url(#lgWool)"><circle cx="27" cy="26" r="4.6"/><circle cx="32" cy="24" r="5"/><circle cx="37" cy="26" r="4.6"/></g>
        <circle cx="28.2" cy="36.5" r="2.4" fill="#fff"/><circle cx="35.8" cy="36.5" r="2.4" fill="#fff"/>
        <circle cx="28.7" cy="37" r="1.2" fill="#262b52"/><circle cx="36.3" cy="37" r="1.2" fill="#262b52"/>
      </svg></span>
      SchafVPN
    </div>
    <div class="win">
      <button id="minBtn" aria-label="Küçült"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 6h8"/></svg></button>
      <button id="closeBtn" class="close" aria-label="Kapat"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <div class="toast" id="toast" role="alert">
    <h3 id="toastTitle">Bağlantı kesildi</h3>
    <p id="toastMsg"></p>
    <div class="actions">
      <button id="logBtn">Log'u aç</button>
      <button id="closeToast">Kapat</button>
    </div>
  </div>

  <main class="stage enter">
    <div class="chip"><span class="cdot"></span><span id="chipText">Korumasız</span></div>
    <div class="orb">
      <svg class="halo" viewBox="0 0 308 308" aria-hidden="true">
        <circle cx="154" cy="154" r="128"/><circle cx="154" cy="154" r="152"/>
      </svg>

  <section class="stats enter d1">

    </div>
    <div class="stat">
      <div class="k"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></i>Yükleme<span class="tot" id="upTot">0 KB</span></div>
      <div class="v" id="up">0<small>KB/s</small></div>
      <svg class="spark" id="upSpark" viewBox="0 0 100 40" preserveAspectRatio="none"><path class="fill"/><path class="line"/></svg>
    </div>

  <section class="list enter d2">
    <div class="row">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11.5a7 7 0 0 1 14 0C19 15.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
      <div class="txt"><div class="lbl">Görünen konum</div><div class="val dim" id="loc">Aranıyor…</div></div>
      <span class="tag cc" id="cc" hidden></span>
    </div>
    <div class="row">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
      <div class="txt"><div class="lbl">IP adresi</div><div class="val dim" id="ip">—</div></div>
    </div>
    <div class="row" id="serverRow">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></div>
      <div class="txt"><div class="lbl" id="meta">VLESS</div><div class="val" id="name">—</div></div>
      <span class="tag">TUN</span>
    </div>
  </section>

<script>
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.chrome && chrome.webview && chrome.webview.postMessage(m);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- pencere ---- */
  $('bar').addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button')) return;
    send({ cmd: 'drag' });
  });
  $('minBtn').addEventListener('click', () => send({ cmd: 'minimize' }));
  $('closeBtn').addEventListener('click', () => send({ cmd: 'close' }));

  /* ---- Yay (spring): mevcut değer + hızdan devam eder, her an kesilebilir ---- */
  class Spring {
    constructor(value, onUpdate) { this.v = value; this.vel = 0; this.t = value; this.cb = onUpdate; this.raf = 0; this.tune(0.3, 1); }
    tune(response, damping) { this.k = (2 * Math.PI / response) ** 2; this.c = 4 * Math.PI * damping / response; }
    to(target, response = 0.3, damping = 1) {
      this.tune(response, damping); this.t = target;
      if (reduceMotion) { this.v = target; this.vel = 0; this.cb(target); return; }
      if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this.step); }
    }
    step = (now) => {
      const dt = Math.min((now - this.last) / 1000, 1 / 30); this.last = now;
      const n = 4, h = dt / n;
      for (let i = 0; i < n; i++) {
        const a = -this.k * (this.v - this.t) - this.c * this.vel;
        this.vel += a * h; this.v += this.vel * h;
      }
      if (Math.abs(this.vel) < 0.002 && Math.abs(this.v - this.t) < 0.0005) {
        this.v = this.t; this.vel = 0; this.cb(this.v); this.raf = 0; return;
      }
      this.cb(this.v); this.raf = requestAnimationFrame(this.step);
    };
  }

  /* ---- Güç butonu ---- */
  const power = $('power');
  const press = new Spring(1, (s) => { power.style.transform = `scale(${s})`; });
  let pressing = false;

  power.addEventListener('pointerdown', (e) => {
    if (power.disabled || e.button !== 0) return;
    pressing = true;
    power.setPointerCapture(e.pointerId);
    press.to(0.93, 0.16, 1);
  });
  power.addEventListener('pointerup', (e) => {
    if (!pressing) return;
    pressing = false;
    press.to(1, 0.42, 0.72);
    const r = power.getBoundingClientRect(), pad = 12;
    if (e.clientX > r.left - pad && e.clientX < r.right + pad &&
        e.clientY > r.top - pad && e.clientY < r.bottom + pad) toggle();
  });
  power.addEventListener('pointercancel', () => { pressing = false; press.to(1, 0.35, 1); });
  power.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); press.to(0.95, 0.12, 1);
      setTimeout(() => press.to(1, 0.4, 0.75), 90); toggle();
    }
  });
  power.addEventListener('click', (e) => e.preventDefault());

  /* ---- Durum ---- */
  let state = 'idle', connectedAt = 0, tick = 0;
  const TEXT = {
    idle:       ['Bağlı değil', 'Bağlanmak için dokun', 'Bağlan', 'Korumasız'],
    connecting: ['Bağlanıyor', 'Güvenli tünel kuruluyor…', 'Bekleyin', 'Bağlanıyor'],
    connected:  ['Bağlandı', '', 'Bağlantıyı kes', 'Korunuyor'],
  };

  function toggle() {
    if (state === 'connecting') return;
    setState(state === 'connected' ? 'idle' : 'connecting'); // anında tepki
    hideToast();
    send({ cmd: 'toggle' });
  }

  function swapText(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }

  function freezeSpin() {
    const spin = $('spin');
    const t = getComputedStyle(spin).transform;
    spin.style.transform = t === 'none' ? '' : t;
  }

  function setState(next) {
    if (next === state) return;
    if (state === 'connecting') freezeSpin();
    if (next === 'connecting') $('spin').style.transform = '';
    const prev = state;
    state = next;
    document.body.dataset.state = next;
    const [title, sub, label, chip] = TEXT[next];
    swapText($('title'), title);
    swapText($('chipText'), chip);
    power.setAttribute('aria-label', label);
    clearInterval(tick);
    if (next === 'connected') {
      if (prev !== 'connected' && !reduceMotion) {
        const r = $('ripple'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
      }
      updateTimer(); tick = setInterval(updateTimer, 1000);
    } else {
      swapText($('sub'), sub);
      if (next === 'connecting') resetTraffic();
      setSpeed('down', 0); setSpeed('up', 0);
    }
  }

  function updateTimer() {
    const s = Math.max(0, Math.floor((Date.now() - connectedAt) / 1000));
    const p = (n) => String(n).padStart(2, '0');
    const text = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
    const sub = $('sub');
    if (!sub.textContent.includes(':')) swapText(sub, text); else sub.textContent = text;
  }

  /* ---- Trafik ---- */
  const N = 40;
  const hist = { down: Array(N).fill(0), up: Array(N).fill(0) };
  const total = { down: 0, up: 0 };

  function resetTraffic() {
    hist.down.fill(0); hist.up.fill(0); total.down = total.up = 0;
    drawSpark('down'); drawSpark('up'); setTotal('down'); setTotal('up');
  }
  function fmtRate(b) {
    if (b <= 0) return ['0', 'KB/s'];
    if (b < 1024 * 1024) { const k = b / 1024; return [k < 10 ? k.toFixed(1) : Math.round(k) + '', 'KB/s']; }
    const m = b / 1048576; return [m < 10 ? m.toFixed(1) : Math.round(m) + '', 'MB/s'];
  }
  function fmtSize(b) {
    if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
    if (b < 1073741824) return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB';
    return (b / 1073741824).toFixed(2) + ' GB';
  }
  function setSpeed(id, bytes) {
    const [n, u] = fmtRate(bytes);
    $(id).innerHTML = `${n}<small>${u}</small>`;
  }
  function setTotal(id) { $(id + 'Tot').textContent = fmtSize(total[id]); }
  function drawSpark(id) {
    const h = hist[id], max = Math.max(64 * 1024, ...h) * 1.15;
    const pts = h.map((v, i) => [(i / (N - 1)) * 100, 40 - (v / max) * 36]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
      d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
    }
    const svg = $(id + 'Spark');
    svg.querySelector('.line').setAttribute('d', d);
    svg.querySelector('.fill').setAttribute('d', `${d} L100,40 L0,40 Z`);
  }
  function onTraffic(up, down) {
    hist.down.push(down); hist.down.shift();
    hist.up.push(up); hist.up.shift();
    total.down += down; total.up += up;
    setSpeed('down', down); setSpeed('up', up);
    drawSpark('down'); drawSpark('up'); setTotal('down'); setTotal('up');
  }
  resetTraffic();

  /* ---- IP / konum ---- */
  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(['tr'], { type: 'region' }); } catch {}
  function onIp(m) {
    const loc = $('loc'), ip = $('ip'), cc = $('cc');
    if (m.loading) { loc.classList.add('dim'); swapText(loc, 'Aranıyor…'); return; }
    if (m.error) { loc.classList.add('dim'); swapText(loc, 'Öğrenilemedi'); swapText(ip, '—'); ip.classList.add('dim'); cc.hidden = true; return; }
    const country = m.country ? ((regionNames && regionNames.of(m.country)) || m.country) : '';
    loc.classList.remove('dim'); ip.classList.remove('dim');
    swapText(loc, [m.city, country].filter(Boolean).join(', ') || '—');
    swapText(ip, m.ip || '—');
    cc.hidden = !m.country; cc.textContent = m.country || '';
  }

  /* ---- Hata bildirimi ---- */
  function showToast(title, msg) {
    $('toastTitle').textContent = title; $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
  }
  function hideToast() { $('toast').classList.remove('show'); }
  $('closeToast').addEventListener('click', hideToast);
  $('logBtn').addEventListener('click', () => send({ cmd: 'openLog' }));

  /* ---- C# mesajları ---- */
  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener('message', (e) => {
      const m = e.data;
      if (m.type === 'state') {
        if (m.name !== undefined) $('name').textContent = m.name;
        if (m.detail !== undefined) $('meta').textContent = m.detail;
        $('serverRow').classList.toggle('bad', !!m.profileError);
        power.disabled = !!m.profileError;
        if (m.connectedAt) connectedAt = m.connectedAt;
        setState(m.state);
        if (m.error) showToast(m.errorTitle || 'Bağlantı kesildi', m.error);
      } else if (m.type === 'traffic' && state === 'connected') {
        onTraffic(m.up, m.down);
      } else if (m.type === 'ip') {
        onIp(m);
      }
    });
  }

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  send({ cmd: 'ready' });
</script>
</body>
</html>
